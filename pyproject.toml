[project]
name = "movable-reality"
version = "0.1.0"
description = "Phone video to a metric, object-separated, agent-editable 3D Gaussian Splatting twin, built on Meta models."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "openai>=3.39",
    "meta-sam-parser>=0.1.0",
    "python-dotenv>=1.0",
    "numpy>=2.0",
    "pillow>=11.0",
    "pydantic>=2.8",
    "plyfile>=1.1",
    "modal>=1.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "fast-simplification>=0.2.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/movable_reality"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["paid: calls a paid API; skipped unless RUN_PAID_TESTS=1"]
